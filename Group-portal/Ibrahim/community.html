<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Workplace | Jhimd</title>
    <style>
        :root {
            --white: #ffffff;
            --muted: #dfe9ff;
            --blue: #0952f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                url("1.jpg") center/cover no-repeat fixed;
            color: var(--white);
        }

        a {
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        header {
            padding: 18px 40px;
            background: rgba(4, 37, 180, 0.192);
            backdrop-filter: blur(4px);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .navlogo {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--white);
        }

        .logotext {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            color: var(--white);
        }

        .brand-subtitle {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 6px;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-item {
            white-space: nowrap;
        }

        .nav-link {
            color: var(--white);
            padding: 8px 14px;
            border-radius: 10px;
            transition: 0.3s ease;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            background: rgb(4, 175, 243);
        }

        .community-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(180px, 1fr));
            gap: 20px;
            padding: 40px 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .community-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 22px 16px;
            text-align: center;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button {
            display: inline-block;
            background: var(--blue);
            color: var(--white);
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #0d63ff;
        }

        @media (max-width: 900px) {
            .community-grid {
                grid-template-columns: repeat(2, minmax(180px, 1fr));
            }
        }

        @media (max-width: 500px) {
            .community-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="navlogo">
                <span class="logotext">Jhimd</span>
                <span class="brand-subtitle">AI Workplace</span>
            </a>

            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="learn.html" class="nav-link">Learn</a></li>
                <li class="nav-item"><a href="Action.html" class="nav-link">Action</a></li>
                <li class="nav-item"><a href="Lifelong Learning.html" class="nav-link">Lifelong Learning</a></li>
                <li class="nav-item"><a href="Careers.html" class="nav-link">Careers</a></li>
                <li class="nav-item"><a href="community.html" class="nav-link">Community</a></li>
            </ul>
        </nav>
    </header>

    <main class="community-grid">
        <div class="community-card">
            <a href="../Ahmad/index.html" class="button">Visit Website</a>
        </div>

        <div class="community-card">
            <a href="../Sarah/index.html" class="button">Visit Website</a>
        </div>

        <div class="community-card">
            <a href="../Jason/index.html" class="button">Visit Website</a>
        </div>

        <div class="community-card">
            <a href="../index.html" class="button">Back to Group Portal</a>
        </div>
    </main>
</body>

</html>
